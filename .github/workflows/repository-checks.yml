name: repository-checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.2'
          use-public-rspm: true
      - uses: r-lib/actions/setup-renv@v2
      - name: Parse R code and validate released intermediates
        # Do not use --vanilla here: the project .Rprofile activates the
        # package library restored by setup-renv.
        run: Rscript tests/check_repository.R
      - name: Verify released-workbook checksums
        working-directory: data/intermediate
        run: sha256sum --check SHA256SUMS.txt
